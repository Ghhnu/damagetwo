name: Build DamageOn Mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.8
          cache-disabled: true   # <--- Evita los problemas de caché

      - name: Build mod
        run: gradle build --stacktrace   # <--- Muestra el error detallado

      - name: Upload compiled jar
        uses: actions/upload-artifact@v4
        with:
          name: damageon-mod-jar
          path: build/libs/*.jar
