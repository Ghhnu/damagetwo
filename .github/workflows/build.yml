name: Build DamageOn Mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build mod with full logs
        id: build
        run: |
          ./gradlew build --stacktrace 2>&1 | tee build-output.log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "::error::Build failed. Check the artifact 'gradle-build-log' for details."
            exit 1
          fi

      - name: Upload build log if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: build-output.log
