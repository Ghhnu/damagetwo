name: Build DamageOn Mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle (with cache disabled)
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.8
          cache-disabled: true   # Evita problemas de caché

      - name: List directory contents (for debugging)
        run: |
          echo "Current directory:"
          pwd
          echo "Files:"
          ls -la

      - name: Build mod and capture full log
        id: build
        run: |
          cd damagetwo   # Cambia por el nombre real de la carpeta
          gradle build --stacktrace --info 2>&1 | tee build-output.log
          EXIT_CODE=${PIPESTATUS[0]}
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          if [ $EXIT_CODE -ne 0 ]; then
            echo "::error::Build failed with exit code $EXIT_CODE."
            cat build-output.log
            exit $EXIT_CODE
          fi

      - name: Upload build log (always, even if build succeeded)
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: build-output.log
        if: always()   # Sube el archivo aunque falle el paso anterior
